<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e16"/>
      <stop offset="1" stop-color="#15171f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#scan)"/>

  <rect x="24" y="24" width="464" height="464" rx="76"
        fill="none" stroke="#39ff8a" stroke-width="6" opacity="0.95" filter="url(#glow)"/>

  <g filter="url(#glow)">
    <polygon points="256,108 412,388 100,388"
             fill="none" stroke="#39ff8a" stroke-width="22"
             stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="256,108 412,388 100,388"
             fill="#39ff8a" opacity="0.08"/>
  </g>

  <rect x="100" y="412" width="312" height="6" fill="#39ff8a" opacity="0.6" filter="url(#glow)"/>
</svg>
